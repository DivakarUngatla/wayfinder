[project]
name = "wayfinder"
version = "0.1.0"
description = "A reference implementation for exploring, learning, and teaching AI Engineering."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.128.8",
    "langsmith>=0.10.3",
    "openai>=2.45.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]